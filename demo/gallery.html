<!DOCTYPE html>
<!-- modules/motion/demo/gallery.html — 组件 live 展廊（一组件一格，缩放成 0.2 倍并排看）
     用途：① 改组件时一处一处看；② 给下一期挑组件时不用翻片子。
     打开：双击即可（file:// 直开，零外部请求）。每格是一个 1920×1080 的舞台，CSS 缩放到 384×216。
     注意：这一页是 **UI**（不是成片），所以它自己走 rAF 时钟；成片那条路径永远只认 t。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>孟菲斯 × 新野兽派 · 组件展廊</title>
<link rel="stylesheet" href="../styles/skins/memphis-brut.css">
<style>
  html,body{margin:0;background:var(--m-ground);color:var(--m-ink);
    font-family:'Archivo','Microsoft YaHei',system-ui,sans-serif}
  h1{font-size:34px;margin:26px 28px 6px}
  .lead{margin:0 28px 18px;font:16px/1.6 'Geist Mono',Consolas,monospace;color:var(--m-mute)}
  .grid{display:flex;flex-wrap:wrap;gap:26px;padding:0 28px 40px}
  .cell{width:384px}
  .cell h2{font:15px 'Geist Mono',Consolas,monospace;margin:0 0 6px;color:var(--m-mag-deep)}
  .stage{position:relative;width:384px;height:216px;overflow:hidden;background:var(--m-ground);
    border:3px solid var(--m-ink);box-shadow:6px 6px 0 0 var(--m-ink)}
  .inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(.2);transform-origin:0 0;background:var(--m-ground)}
  .bar{position:sticky;top:0;z-index:5;background:var(--m-ink);color:#fff;padding:10px 28px;
    font:15px 'Geist Mono',Consolas,monospace;display:flex;gap:18px;align-items:center}
  .bar b{color:var(--m-acid)}
</style>
</head>
<body>
<div class="bar"><b>组件展廊</b><span id="clock">t=0.00</span><span>空格 播放/暂停 · ← → 逐秒</span></div>
<h1>孟菲斯 × 新野兽派 · 组件</h1>
<p class="lead">每格是一个 1920×1080 的舞台缩到 0.2 倍。组件行为在 <code>lib/components.js</code>，样式在 <code>styles/skins/memphis-brut.css</code>（<code>.m-*</code>），形在 <code>lib/pattern.js</code>。</p>
<div class="grid" id="grid"></div>

<script src="../style/tokens.js"></script>
<script src="../lib/motion.js"></script>
<script src="../lib/rng.js"></script>
<script src="../lib/components.js"></script>
<script src="../lib/pattern.js"></script>
<script src="../lib/fx.js"></script>
<script>
(function () {
  const OM = window.OM, MTK = window.MTK, C = MTK.comp, P = MTK.pat, F = MTK.fx;
  const grid = document.getElementById('grid');
  const cells = [];
  function cell(title, build) {
    const wrap = document.createElement('div'); wrap.className = 'cell';
    const h = document.createElement('h2'); h.textContent = title;
    const stage = document.createElement('div'); stage.className = 'stage';
    const inner = document.createElement('div'); inner.className = 'inner';
    stage.appendChild(inner); wrap.appendChild(h); wrap.appendChild(stage); grid.appendChild(wrap);
    const api = build(inner);
    cells.push({ api, inner });
  }

  /* 统一的时间窗：t 在 [0, 6) 循环；每个组件的 in/out 都在这个窗口里 */
  const T0 = 0.3, OUT = 5.4;

  cell('badge 角标（首帧出现 · 带档案号）', (r) => {
    const b = C.badge(r, { en: 'card', zh: '卡', no: '#mk-0002/12', x: 120, y: 62 });
    return { draw(t) { b.draw(t, {}, { in: T0, out: OUT }); } };
  });
  cell('card 卡（词逐行升起 + 打字机）', (r) => {
    const c = C.card(r, { x: 120, y: 220, w: 900, h: 460, shadow: 'sh-cyan', head: 'card 卡', headTone: 'acid',
      lines: ['硬边 3px · 硬阴影 6px', '白卡压在米白纸上', '圆角一律 0'], typeText: '这张卡的纪律。', cps: 26 });
    return { draw(t) { c.draw(t, {}, { in: T0, out: OUT, lineT0: T0 + 0.3, typeT0: T0 + 1.6, hit: T0 + 1.2 }); } };
  });
  cell('stat 大数字（逐位滚动 · 终点收敛）', (r) => {
    const s = C.stat(r, { x: 160, y: 380, to: 39, size: 168 });
    return { draw(t) { s.draw(t, {}, { in: T0, out: OUT, countT0: T0 + 0.4, countDur: 1.2 }); } };
  });
  cell('compare-table 对照表（行依次归位）', (r) => {
    const tb = C.table(r, { x: 140, y: 240, w: 1500, rowH: 120, labelW: 420, first: 2,
      rows: [['主描边', '3px'], ['硬阴影', '6px 6px 0 0'], ['对比度', '≥ 5.0:1']] });
    return { draw(t) { tb.draw(t, {}, { in: T0, out: OUT, rowT0: T0 + 0.5, rowStagger: 0.3 }); } };
  });
  cell('quote 引述卡', (r) => {
    const q = C.quote(r, { x: 200, y: 360, w: 1400, h: 340, text: '落定不是慢 —— 是把 80% 的路程放在前 23% 的时间里。', source: 'expoOut · t80 0.23' });
    return { draw(t) { q.draw(t, {}, { in: T0, out: OUT }); } };
  });
  cell('evidence 证据框', (r) => {
    const e = C.evidence(r, { x: 240, y: 220, w: 1400, h: 640, caption: 'modules/motion/STYLE.md · §4' });
    return { draw(t) { e.draw(t, {}, { in: T0, out: OUT }); } };
  });
  cell('stamp 印章（砸落 + 回弹）', (r) => {
    const s = C.stamp(r, { x: 860, y: 420, text: '落定', size: 26 });
    return { draw(t) { s.draw(t, {}, { in: T0, hit: T0 + 0.34, out: OUT }); } };
  });
  cell('ribbon 缎带（唯一允许匀速的地方）', (r) => {
    const rb = C.ribbon(r, { y: 500, h: 64, text: 'ripple · silk · swiftSpring · carouselLoop', speed: 200 });
    return { draw(t) { rb.draw(t, {}, { in: T0, out: OUT }); } };
  });
  cell('spine 那条 3px 线（6 槽位 · 变形而不消失）', (r) => {
    const sp = C.spine(r, 6);
    const rect = [{ x1: 200, y1: 260, x2: 1700, y2: 260 }, { x1: 1700, y1: 260, x2: 1700, y2: 820 },
      { x1: 1700, y1: 820, x2: 200, y2: 820 }, { x1: 200, y1: 820, x2: 200, y2: 260 },
      { x1: 200, y1: 540, x2: 1700, y2: 540 }, { x1: 960, y1: 140, x2: 960, y2: 940 }];
    const bar = [{ x1: 960, y1: 540, x2: 960, y2: 540, op: 0 }, { x1: 200, y1: 620, x2: 1700, y2: 620 },
      { x1: 200, y1: 720, x2: 1700, y2: 720 }, { x1: 200, y1: 820, x2: 1700, y2: 820 },
      { x1: 960, y1: 540, x2: 960, y2: 540, op: 0 }, { x1: 960, y1: 540, x2: 960, y2: 540, op: 0 }];
    return { draw(t) { const k = OM.ease.expoOut(Math.min(1, Math.max(0, (t - T0 - 0.6) / 1.4))); sp.draw(t, {}, rect, bar, k); } };
  });
  cell('pattern 孟菲斯的形（代码画的正圆/拱/棋盘/锯齿）', (r) => {
    const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080;
    cv.style.cssText = 'position:absolute;inset:0'; r.appendChild(cv);
    const g = cv.getContext('2d');
    return { draw(t) {
      g.clearRect(0, 0, 1920, 1080);
      P.arch(g, 200, 300, 420, 420, ['#c20056', '#00d9ff', '#ccff00'], 26);
      P.dot(g, 820, 420, 90, '#c20056'); P.ring(g, 1020, 420, 90, 18, '#0a0a0a');
      P.checker(g, 1180, 320, 6, 6, 40, '#0a0a0a', '#f7f4ec');
      P.zigzag(g, 200, 780, 520, 90, 9, '#0a0a0a', 10);
      P.wave(g, 800, 800, 900, 40, 300, '#0a0a0a', 8, t * 0.6);
    } };
  });
  cell('deco 装饰（硬阴影生长 + 斜刀擦除）', (r) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:300px;top:340px;width:520px;height:300px;background:var(--m-paper);border:var(--m-bw) solid var(--m-ink)';
    r.appendChild(box);
    const strip = document.createElement('div');
    strip.style.cssText = 'position:absolute;left:900px;top:420px;width:700px;height:60px;background:var(--m-ink)';
    r.appendChild(strip);
    return { draw(t) { F.hardShadow(box, (t - T0) / 0.5, 'var(--m-mag)', 6); F.wipeIn(strip, (t - T0 - 0.6) / 0.8, 'left'); } };
  });

  /* ── 时钟（这一页是 UI，允许 rAF）── */
  let playing = true, last = 0;
  function draw(t) { for (const c of cells) { try { c.api.draw(t); } catch (e) { } } document.getElementById('clock').textContent = 't=' + t.toFixed(2); }
  function loop() {
    if (playing) {
      const t = ((performance.now() / 1000) % 6);
      last = t; draw(t);
    }
    requestAnimationFrame(loop);
  }
  addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playing = !playing; } });
  draw(1.2); loop();
})();
</script>
</body>
</html>
